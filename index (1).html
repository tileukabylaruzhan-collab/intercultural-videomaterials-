<style>
:root{--navy:#1B2A4A;--navy-mid:#243657;--blue:#2E5FA3;--blue-light:#EBF1FB;--gold:#C8922A;--gold-light:#FEF3DC;--teal:#0D7377;--teal-light:#E0F4F4;--green:#16A34A;--green-light:#DCFCE7;--amber:#D97706;--amber-light:#FEF9C3;--gray:#64748B;--gray-light:#F1F5F9;--border:#E2E8F0;--text:#1E293B;--text-sec:#64748B;--white:#FFFFFF;--radius:10px;--radius-lg:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#F8FAFC;color:var(--text);min-height:100vh}
.topbar{background:var(--navy);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.15)}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{width:34px;height:34px;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--navy)}
.topbar-title{font-size:14px;font-weight:600;color:#fff}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.55);margin-top:1px}
.topbar-badge{background:rgba(200,146,42,.2);color:var(--gold);font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid rgba(200,146,42,.35)}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:260px;flex-shrink:0;background:var(--white);border-right:1px solid var(--border);padding:1.25rem 0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar-section{font-size:10px;font-weight:600;color:var(--gray);letter-spacing:.08em;text-transform:uppercase;padding:0 1.25rem;margin-bottom:8px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 1.25rem;cursor:pointer;transition:background .12s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent}
.sidebar-item:hover{background:var(--gray-light)}
.sidebar-item.active{background:var(--blue-light);border-left-color:var(--blue)}
.sidebar-num{width:26px;height:26px;border-radius:6px;background:var(--gray-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--gray);flex-shrink:0;transition:all .12s}
.sidebar-item.active .sidebar-num{background:var(--blue);color:var(--white)}
.sidebar-item.done .sidebar-num{background:var(--green);color:var(--white)}
.sidebar-info{flex:1;min-width:0}
.sidebar-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-item.active .sidebar-name{color:var(--blue)}
.sidebar-sub-name{font-size:11px;color:var(--text-sec);margin-top:1px}
.sidebar-footer{padding:1rem 1.25rem;border-top:1px solid var(--border);margin-top:1rem}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-sec);margin-bottom:6px}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.main{flex:1;padding:2rem;max-width:960px}
.lesson-header{background:var(--navy);border-radius:var(--radius-lg);padding:1.75rem 2rem;margin-bottom:1.5rem;display:flex;gap:1.25rem;align-items:flex-start}
.lesson-num-big{width:52px;height:52px;border-radius:12px;background:rgba(200,146,42,.2);border:1.5px solid rgba(200,146,42,.4);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--gold);flex-shrink:0}
.lesson-header-info{flex:1}
.lesson-header-info h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.lesson-header-info p{font-size:13px;color:rgba(255,255,255,.6)}
.lesson-header-badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.lbadge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;border:1px solid}
.lbadge-blue{background:rgba(46,95,163,.25);color:#93C5FD;border-color:rgba(147,197,253,.3)}
.lbadge-gold{background:rgba(200,146,42,.2);color:var(--gold);border-color:rgba(200,146,42,.35)}
.info-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem}
.info-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.1rem}
.info-card-label{font-size:10px;color:var(--text-sec);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.info-card-val{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.section-title{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;margin-top:1.5rem}
/* Stage tabs */
.stage-tabs{display:flex;gap:0;margin-bottom:0;border-radius:var(--radius) var(--radius) 0 0;overflow:hidden;border:1px solid var(--border);border-bottom:none}
.stage-tab{flex:1;padding:10px 8px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:var(--gray-light);color:var(--text-sec);transition:all .12s;display:flex;align-items:center;justify-content:center;gap:6px}
.stage-tab:not(:last-child){border-right:1px solid var(--border)}
.stage-tab.active-pre{background:var(--blue-light);color:var(--blue)}
.stage-tab.active-while{background:var(--amber-light);color:var(--amber)}
.stage-tab.active-post{background:var(--green-light);color:var(--green)}
.stage-content{background:var(--white);border:1px solid var(--border);border-radius:0 0 var(--radius-lg) var(--radius-lg);padding:1.25rem;display:none}
.stage-content.visible{display:block}
/* Tasks */
.task-block{margin-bottom:1.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.task-block:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.task-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.task-num{width:24px;height:24px;border-radius:6px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task-num-pre{background:var(--blue-light);color:var(--blue)}
.task-num-while{background:var(--amber-light);color:var(--amber)}
.task-num-post{background:var(--green-light);color:var(--green)}
.task-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.task-meta{font-size:11px;color:var(--text-sec)}
.task-body{font-size:13px;color:var(--text-sec);line-height:1.6;margin-left:34px}
.task-body p{margin-bottom:6px}
.task-body ol,.task-body ul{padding-left:1.2rem;margin-bottom:6px}
.task-body li{margin-bottom:4px}
.task-body strong{color:var(--text);font-weight:600}
/* Table */
.task-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.task-table th{background:var(--gray-light);font-weight:600;color:var(--text);padding:7px 10px;text-align:left;border:1px solid var(--border)}
.task-table td{padding:7px 10px;border:1px solid var(--border);color:var(--text-sec);vertical-align:top}
.task-table tr:nth-child(even) td{background:#FAFAFA}
/* Word bank */
.word-bank{background:var(--gold-light);border:1px solid rgba(200,146,42,.3);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--text);margin-bottom:10px;font-weight:500}
/* Assessment */
.assessment-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:8px}
.assessment-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:.75rem 1rem}
.assessment-card-label{font-size:11px;color:var(--text-sec);margin-bottom:4px}
.assessment-card-val{font-size:18px;font-weight:700;color:var(--blue)}
.assessment-card-desc{font-size:11px;color:var(--text-sec);margin-top:2px}
/* Outcome */
.outcome-box{background:var(--teal-light);border:1px solid rgba(13,115,119,.2);border-radius:var(--radius);padding:1rem 1.25rem;display:flex;align-items:flex-start;gap:10px;margin-bottom:1.5rem}
.outcome-label{font-size:10px;font-weight:600;color:var(--teal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.outcome-text{font-size:13px;font-weight:500;color:var(--text)}
/* Nav */
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
.nav-btn{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius);border:1px solid var(--border);background:var(--white);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;transition:all .12s}
.nav-btn:hover{background:var(--gray-light)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn-primary{background:var(--blue);color:var(--white);border-color:var(--blue)}
.nav-btn-primary:hover{background:#1B4A8A}
.mark-done-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--green);background:var(--green-light);font-size:12px;font-weight:600;color:var(--green);cursor:pointer;transition:all .12s;margin-bottom:1.5rem}
.mark-done-btn:hover{background:#BBF7D0}
.mark-done-btn.done{background:var(--green);color:#fff}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:700px){.sidebar{display:none}.main{padding:1rem}}
</style>
</head>

<script>
const LESSONS=[
{n:1,t:"Greeting Cultures",s:"Register · Non-verbal · Pragmatics",
focus:"Greeting styles · Body language · Personal space",
video:"BBC Learning English — How to greet people formally",
link:"https://www.youtube.com/watch?v=o5ghhSAxopw",
duration:"3 min",icc:"Register awareness · Pragmatics · Non-verbal communication",
out:"Students identify formal/informal register and cultural norms in English greetings",
goal:"Produce culturally appropriate greetings in formal and informal contexts",
pre:[
{title:"Task 1 · Warm-up Discussion",meta:"pairs · 4 min",body:`<p>Talk to your partner. Answer in full sentences.</p><ol>
<li>Think about your own culture: how do you greet (a) a close friend; (b) a teacher; (c) a stranger you meet at a formal event? What changes?</li>
<li>Look at these two sentences. Which is formal and which is informal? How do you know?<br><strong>A)</strong> "Yo, what's up!" &nbsp;&nbsp;<strong>B)</strong> "Good morning, it's a pleasure to meet you."</li>
<li>Before watching — <strong>PREDICT:</strong> how do you think British people greet someone for the very first time in a formal setting?</li></ol>`},
{title:"Task 2 · Vocabulary — Match the Word to its Definition",meta:"individual",body:`<p>Match words 1–7 with definitions A–G.</p>
<table class="task-table"><thead><tr><th>#</th><th>Word</th><th>Definition</th></tr></thead><tbody>
<tr><td>1</td><td><strong>register</strong></td><td>A — A greeting used in official situations (job interview, first meeting)</td></tr>
<tr><td>2</td><td><strong>honorific</strong></td><td>B — Looking directly into another person's eyes during conversation</td></tr>
<tr><td>3</td><td><strong>formal greeting</strong></td><td>C — A title showing respect (Mr., Dr., Professor)</td></tr>
<tr><td>4</td><td><strong>eye contact</strong></td><td>D — The level of formality in language (formal, neutral, informal)</td></tr>
<tr><td>5</td><td><strong>handshake</strong></td><td>E — The physical distance between two people when they communicate</td></tr>
<tr><td>6</td><td><strong>proximity</strong></td><td>F — Two people clasping hands briefly as a greeting or farewell</td></tr>
<tr><td>7</td><td><strong>faux pas</strong></td><td>G — An embarrassing social mistake caused by ignoring cultural rules</td></tr>
</tbody></table>`},
{title:"Task 3 · True / False — Predict Before You Watch",meta:"individual then check",body:`<table class="task-table"><thead><tr><th>Statement</th><th>Prediction</th><th>Evidence from video</th></tr></thead><tbody>
<tr><td>1. In British formal situations, shaking hands is the standard greeting for a first meeting.</td><td>T / F</td><td></td></tr>
<tr><td>2. The phrase 'How do you do?' is answered with 'I'm doing great, thanks!'</td><td>T / F</td><td></td></tr>
<tr><td>3. Eye contact is generally AVOIDED in English-speaking cultures as a sign of respect.</td><td>T / F</td><td></td></tr>
<tr><td>4. In formal English, people address others using their first name immediately.</td><td>T / F</td><td></td></tr>
<tr><td>5. Non-verbal communication (posture, tone) plays an important role in formal greetings.</td><td>T / F</td><td></td></tr>
<tr><td>6. Using the wrong register in a greeting can cause a cultural misunderstanding.</td><td>T / F</td><td></td></tr>
</tbody></table>`},
{title:"Task 4 · Gap-fill — Activate Vocabulary Before Watching",meta:"individual",body:`<div class="word-bank">Word Bank: register · handshake · faux pas · eye contact · set-phrase · proximity</div>
<ol>
<li>In British culture, using someone's title and surname shows you understand the correct ________ for a formal context.</li>
<li>A firm ________ is still the most common physical greeting in professional British settings.</li>
<li>Saying 'Hey mate, how's it going?' to your boss on the first day would be a social ________.</li>
<li>Good ________ — looking directly at the person — signals confidence and respect.</li>
<li>The phrase 'How do you do?' is a fixed ________ expression. The correct reply is simply to repeat it back.</li>
<li>Understanding the ________ — how far to stand from someone — is part of non-verbal communication.</li>
</ol>`}
],
wh:[
{title:"Task 5 · Cultural Observation Checklist",meta:"while watching",body:`<table class="task-table"><thead><tr><th>Observed Behaviour</th><th>YES ✓</th><th>PARTLY ◑</th><th>NO ✗</th></tr></thead><tbody>
<tr><td>Speaker uses formal vocabulary (titles, full phrases)</td><td></td><td></td><td></td></tr>
<tr><td>Speaker maintains appropriate register throughout</td><td></td><td></td><td></td></tr>
<tr><td>Non-verbal cues (posture, gesture, tone) match the formal context</td><td></td><td></td><td></td></tr>
<tr><td>Speaker demonstrates awareness of cultural expectations</td><td></td><td></td><td></td></tr>
<tr><td>Difference between formal and informal greetings is made clear</td><td></td><td></td><td></td></tr>
</tbody></table>`},
{title:"Task 6 · Note-taking — What Does the Video Show?",meta:"while watching",body:`<table class="task-table"><thead><tr><th>Question</th><th>Your notes</th></tr></thead><tbody>
<tr><td>1. What vocabulary is used in formal greetings? (list 3+ phrases)</td><td></td></tr>
<tr><td>2. How does the speaker's tone/voice differ from informal speech?</td><td></td></tr>
<tr><td>3. What physical/non-verbal behaviours are shown?</td><td></td></tr>
<tr><td>4. What would happen if you used an informal greeting in this context?</td><td></td></tr>
<tr><td>5. What surprised you most about British greeting culture?</td><td></td></tr>
</tbody></table>`},
{title:"Task 7 · Sentence Sorting — Build the Dialogue",meta:"individual",body:`<p>Unscramble each line into a correct sentence. Together they make a formal greeting dialogue.</p>
<table class="task-table"><thead><tr><th>#</th><th>Scrambled words</th><th>Your answer</th></tr></thead><tbody>
<tr><td>1</td><td>morning / Good / it / a / to / pleasure / meet / is / you / ,</td><td></td></tr>
<tr><td>2</td><td>introduce / allow / me / to / myself / please / ,</td><td></td></tr>
<tr><td>3</td><td>do / do / How / you / ?</td><td></td></tr>
<tr><td>4</td><td>do / How / you / — / do / the / correct / response / is / to / repeat / this</td><td></td></tr>
<tr><td>5</td><td>look / to / forward / working / together / I</td><td></td></tr>
<tr><td>6</td><td>you / having / us / Thank / for</td><td></td></tr>
</tbody></table>`},
{title:"Task 8 · Error Correction — Spot the Mistake",meta:"individual",body:`<p>Each sentence contains ONE cultural or linguistic error. Find it and write the correction.</p>
<table class="task-table"><thead><tr><th>Sentence with ONE error</th><th>Corrected sentence</th></tr></thead><tbody>
<tr><td>1. In formal British introductions, you should use the other person's first name straight away.</td><td></td></tr>
<tr><td>2. 'How do you do?' is an informal question — answer it with: 'Fine thanks, how about you?'</td><td></td></tr>
<tr><td>3. Eye contact is considered rude in English-speaking cultures and should always be avoided.</td><td></td></tr>
<tr><td>4. A faux pas is a brilliant cultural move that always impresses people in formal situations.</td><td></td></tr>
<tr><td>5. The word 'register' in linguistics means the volume of a speaker's voice.</td><td></td></tr>
</tbody></table>`}
],
po:[
{title:"Task 9 · Role-play",meta:"pairs · 6 min",body:`<table class="task-table"><thead><tr><th>Scenario</th><th>Student A</th><th>Student B</th><th>Key challenge</th></tr></thead><tbody>
<tr><td><strong>A — Formal</strong></td><td>New British teacher (Mr./Ms. + surname)</td><td>Kazakh school director</td><td>Correct titles, register, handshake, eye contact</td></tr>
<tr><td><strong>B — Informal</strong></td><td>English-speaking exchange student (age 16)</td><td>Kazakh classmate (age 16)</td><td>Friendly but not rude — find the right casual register</td></tr>
</tbody></table>
<p style="margin-top:10px"><strong>After the role-play, discuss:</strong> What was the hardest part? Did any cultural misunderstandings happen? How did you fix them?</p>`},
{title:"Task 10 · Cross-cultural Comparison Table",meta:"pairs + class discussion",body:`<table class="task-table"><thead><tr><th>Aspect</th><th>British / English-speaking</th><th>Kazakh culture</th><th>Key difference</th></tr></thead><tbody>
<tr><td>Opening words</td><td></td><td></td><td></td></tr>
<tr><td>Physical contact</td><td></td><td></td><td></td></tr>
<tr><td>Eye contact</td><td></td><td></td><td></td></tr>
<tr><td>Use of titles</td><td></td><td></td><td></td></tr>
<tr><td>Personal space</td><td></td><td></td><td></td></tr>
<tr><td>Tone and formality</td><td></td><td></td><td></td></tr>
</tbody></table>`},
{title:"Task 11 · Reflective Writing",meta:"individual · 80–120 words",body:`<p>What did this video teach you about greeting cultures? What surprised you? How will this knowledge help you communicate better in English-speaking contexts? Compare with your own cultural experience.</p>`},
{title:"Assessment",meta:"ICC Score",body:`<table class="task-table"><thead><tr><th>ICC Descriptor</th><th>Assessment Criteria</th><th>Score</th></tr></thead><tbody>
<tr><td>Understanding cultural context</td><td>Correctly identifies British greeting norms</td><td>15 pts</td></tr>
<tr><td>Register awareness</td><td>Distinguishes formal vs. informal with examples</td><td>15 pts</td></tr>
<tr><td>Pragmatic interpretation</td><td>Recognises implied meaning in greeting phrases</td><td>15 pts</td></tr>
<tr><td>Non-verbal communication</td><td>Analyses posture, eye contact, physical behaviour</td><td>10 pts</td></tr>
<tr><td>Reflection quality</td><td>Thoughtful written comparison with own culture</td><td>10 pts</td></tr>
<tr><td>Role-play performance</td><td>Fluent, culturally appropriate, correct register</td><td>10 pts</td></tr>
</tbody></table>`}
]},

{n:2,t:"School Life Across Cultures",s:"Behaviour · Hierarchy · Norms",
focus:"Teacher-student relationships · Classroom behaviour norms",
video:"YouTube Education — Classroom culture comparison",
link:"https://www.youtube.com/",duration:"5–6 min",
icc:"Cultural norms · Social behaviour · Comparative analysis",
out:"Students identify and compare classroom cultural norms across cultures",
goal:"Distinguish cultural behaviour patterns in educational settings",
pre:[
{title:"Task 1 · Warm-up Discussion",meta:"pairs · 4 min",body:`<ol>
<li>How do students behave in your classroom? What is considered respectful?</li>
<li>Do you think students in the UK, Japan, and the USA behave the same way in class? What differences might there be?</li>
<li><strong>PREDICT:</strong> What classroom rules or habits might surprise a foreign student visiting a Kazakh school?</li>
</ol>`},
{title:"Task 2 · Vocabulary — Match the Word to its Definition",meta:"individual",body:`<table class="task-table"><thead><tr><th>#</th><th>Word</th><th>Definition</th></tr></thead><tbody>
<tr><td>1</td><td><strong>discipline</strong></td><td>A — The accepted rules of behaviour in a group or society</td></tr>
<tr><td>2</td><td><strong>respect</strong></td><td>B — Controlled behaviour and obedience to rules</td></tr>
<tr><td>3</td><td><strong>hierarchy</strong></td><td>C — A system where people are ranked according to status or authority</td></tr>
<tr><td>4</td><td><strong>participation</strong></td><td>D — Admiration or regard for someone's status, feelings, or rights</td></tr>
<tr><td>5</td><td><strong>norm</strong></td><td>E — Taking an active part in a discussion, activity, or class</td></tr>
</tbody></table>`},
{title:"Task 3 · True / False — Predict, then Verify",meta:"individual then check",body:`<table class="task-table"><thead><tr><th>Statement</th><th>Prediction</th><th>Evidence from video</th></tr></thead><tbody>
<tr><td>1. Students in all cultures are expected to raise their hand before speaking in class.</td><td>T / F</td><td></td></tr>
<tr><td>2. In some cultures, disagreeing with a teacher openly is considered disrespectful.</td><td>T / F</td><td></td></tr>
<tr><td>3. Classroom participation norms are the same around the world.</td><td>T / F</td><td></td></tr>
<tr><td>4. Eye contact with a teacher can signal respect in some cultures and disrespect in others.</td><td>T / F</td><td></td></tr>
<tr><td>5. School uniforms reflect cultural values about equality and identity.</td><td>T / F</td><td></td></tr>
</tbody></table>`},
{title:"Task 4 · Prediction Grid",meta:"pairs",body:`<table class="task-table"><thead><tr><th>Question</th><th>Japan</th><th>Finland</th><th>USA</th><th>Kazakhstan</th></tr></thead><tbody>
<tr><td>Do students stand when the teacher enters?</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Do students call the teacher by first name?</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Is group work common?</td><td></td><td></td><td></td><td></td></tr>
<tr><td>Are mobile phones allowed?</td><td></td><td></td><td></td><td></td></tr>
</tbody></table>`}
],

{title:"Task 2 · Vocabulary — Match the Word to its Definition",meta:"individual",body:`<table class="task-table"><thead><tr><th>#</th><th>Word</th><th>Definition</th></tr></thead><tbody>
<tr><td>1</td><td><strong>sarcasm</strong></td><td>A — Saying something is much less serious/important than it really is</td></tr>
<tr><td>2</td><td><strong>irony</strong></td><td>B — Using words that mean the OPPOSITE of what you actually intend</td></tr>
<tr><td>3</td><td><strong>understatement</strong></td><td>C — Mocking or criticising something through sharp ironic language</td></tr>
<tr><td>4</td><td><strong>faux pas</strong></td><td>D — An embarrassing social mistake that violates cultural norms</td></tr>
<tr><td>5</td><td><strong>cultural taboo</strong></td><td>E — A topic that is forbidden or deeply uncomfortable in a particular culture</td></tr>
<tr><td>6</td><td><strong>face-saving</strong></td><td>F — A strategy used to protect your own or someone else's dignity</td></tr>
<tr><td>7</td><td><strong>misunderstanding</strong></td><td>G — When two people interpret the same words or actions differently</td></tr>
</tbody></table>`},

function stageColor(s){return['pre','while','post'][s]}
function stageLabel(s){return['Pre-viewing','While-viewing','Post-viewing'][s]}
function stageIcon(s){
  return[`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10,8 16,12 10,16"/></svg>`,
  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="12" x2="15" y2="14"/></svg>`,
  `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,6 9,17 4,12"/></svg>`][s];
}
function checkIcon(){return`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20,6 9,17 4,12"/></svg>`}

function renderSidebar(){
  document.getElementById('sidebar').innerHTML=`
    <div class="sidebar-section" style="margin-bottom:12px">Lessons</div>
    ${LESSONS.map((l,i)=>`
      <button class="sidebar-item ${i===cur?'active':''} ${done.has(i)?'done':''}" onclick="goTo(${i})">
        <div class="sidebar-num">${done.has(i)?checkIcon():l.n}</div>
        <div class="sidebar-info">
          <div class="sidebar-name">${l.t}</div>
          <div class="sidebar-sub-name">${l.s}</div>
        </div>
      </button>`).join('')}
    <div class="sidebar-footer">
      <div class="progress-label"><span>Progress</span><span>${done.size} / ${LESSONS.length}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${done.size/LESSONS.length*100}%"></div></div>
    </div>`;
}

function renderMain(){
  const l=LESSONS[cur];
  const stages=[l.pre,l.wh,l.po];
  const tasks=stages[stage];
  const colors=['blue','amber','green'];
  const tabActiveClass=['active-pre','active-while','active-post'];

  document.getElementById('main').innerHTML=`
    <div class="lesson-header">
      <div class="lesson-num-big">${l.n}</div>
      <div class="lesson-header-info">
        <h1>${l.t}</h1>
        <p>${l.s}</p>
        <div class="lesson-header-badges">
          <span class="lbadge lbadge-blue">B1 Level</span>
          <span class="lbadge lbadge-gold">${l.duration}</span>
          <span class="lbadge lbadge-blue">${l.icc}</span>
        </div>
      </div>
    </div>

    <div class="info-row">
      <div class="info-card"><div class="info-card-label">ICC Focus</div><div class="info-card-val">${l.focus}</div></div>
      <div class="info-card"><div class="info-card-label">Video Source</div><div class="info-card-val">${l.video}${l.link?` · <a href="${l.link}" target="_blank" style="color:var(--blue)">Watch ↗</a>`:''}</div></div>
      <div class="info-card"><div class="info-card-label">Communicative Goal</div><div class="info-card-val">${l.goal}</div></div>
    </div>

    <div class="outcome-box">
      <div><div class="outcome-label">Expected Outcome</div><div class="outcome-text">${l.out}</div></div>
    </div>

    <div class="section-title">Tasks by Stage</div>
    <div class="stage-tabs">
      ${[0,1,2].map(i=>`<button class="stage-tab ${stage===i?tabActiveClass[i]:''}" onclick="setStage(${i})">${stageIcon(i)} ${stageLabel(i)}</button>`).join('')}
    </div>
    <div class="stage-content visible">
      ${tasks.map((t,ti)=>`
        <div class="task-block">
          <div class="task-header">
            <div class="task-num task-num-${stageColor(stage)}">T${ti+1}</div>
            <div>
              <div class="task-title">${t.title}</div>
              ${t.meta?`<div class="task-meta">${t.meta}</div>`:''}
            </div>
          </div>
          <div class="task-body">${t.body}</div>
        </div>`).join('')}
    </div>

    <button class="mark-done-btn ${done.has(cur)?'done':''}" onclick="toggleDone()">
      ${checkIcon()} ${done.has(cur)?'Completed ✓':'Mark as completed'}
    </button>
    <div class="nav-row">
      <button class="nav-btn" onclick="goTo(${cur-1})" ${cur===0?'disabled':''}>← Previous</button>
      <span style="font-size:13px;color:var(--text-sec);font-weight:500">${cur+1} / ${LESSONS.length}</span>
      <button class="nav-btn ${cur<LESSONS.length-1?'nav-btn-primary':''}" onclick="goTo(${cur+1})" ${cur===LESSONS.length-1?'disabled':''}>Next →</button>
    </div>`;
}

function setStage(s){stage=s;renderMain();}
function goTo(i){if(i<0||i>=LESSONS.length)return;cur=i;stage=0;renderSidebar();renderMain();window.scrollTo({top:0,behavior:'smooth'});}
function toggleDone(){done.has(cur)?done.delete(cur):done.add(cur);renderSidebar();renderMain();}
renderSidebar();renderMain();
</script>
</body>
</html>
